<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naisenimed (Reaalajas tabelist)</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --success-light: #ecfdf5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 8px 0;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--success-light);
            border: 1px solid #d1fae5;
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #065f46;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .btn-refresh {
            background-color: #ffffff;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background-color: #d1fae5;
        }

        .names-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .name-item {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            background-color: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .name-item:hover {
            border-color: var(--primary);
            background-color: var(--primary-light);
            transform: translateY(-1px);
        }

        .name-index {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background-color: var(--primary-light);
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            margin-right: 14px;
        }

        .loading, .error-message {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .error-message {
            color: #ef4444;
            background-color: #fef2f2;
            border-radius: 8px;
            border: 1px solid #fee2e2;
        }

        footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Naisenimed</h1>
            <p class="subtitle" id="count-info">Laen andmeid Google Sheetsist...</p>
        </header>

        <div class="status-bar">
            <div class="status-indicator">
                <span class="pulse-dot"></span>
                <span id="sync-status">Uuendatakse iga 30s järel</span>
            </div>
            <button class="btn-refresh" id="btn-refresh" onclick="laeNimed()">Värskenda kohe</button>
        </div>

        <ol class="names-list" id="names-list">
            <li class="loading">Laen andmeid Google Sheetsi tabelist...</li>
        </ol>

        <footer>
            <div id="last-updated">Viimane kontroll: ootel</div>
            <div>
                Allikas: <a href="https://docs.google.com/spreadsheets/d/117-AtcYzjRtjS5TTrLmVJte-19bRW4KpgvXFuyTmyh8/edit?gid=1862818705#gid=1862818705" target="_blank" rel="noopener">Google Sheets (naisenimed)</a>
            </div>
        </footer>
    </div>

    <script>
        // Google Sheets CSV ekspordi link täpse vahekaardiga (naisenimed gid=1862818705)
        const CSV_URL = "https://docs.google.com/spreadsheets/d/117-AtcYzjRtjS5TTrLmVJte-19bRW4KpgvXFuyTmyh8/export?format=csv&gid=1862818705";
        const INTERVAL_SEKUNDID = 30;
        let jargmineUuendusAeg = Date.now() + INTERVAL_SEKUNDID * 1000;

        async function laeNimed() {
            const listElement = document.getElementById("names-list");
            const countInfo = document.getElementById("count-info");
            const lastUpdated = document.getElementById("last-updated");
            const btnRefresh = document.getElementById("btn-refresh");

            btnRefresh.disabled = true;
            btnRefresh.textContent = "Laen...";

            try {
                // Lisame ajatempli päringule, et vältida brauseri vahemälu (cache-busting)
                const cacheBusterUrl = `${CSV_URL}&_t=${Date.now()}`;
                const vastus = await fetch(cacheBusterUrl);

                if (!vastus.ok) {
                    throw new Error(`Serveri vastuse kood: ${vastus.status}`);
                }

                const csvTekst = await vastus.text();
                
                // Jagame ridadeks, puhastame ja filtreerime tühjad read
                const read = csvTekst.split(/\r?\n/)
                    .map(rida => {
                        let puhas = rida.trim();
                        if (puhas.startsWith('"') && puhas.endsWith('"')) {
                            puhas = puhas.substring(1, puhas.length - 1);
                        }
                        return puhas.split(",")[0].trim();
                    })
                    .filter(nimi => nimi.length > 0);

                // Uuendame HTML-i
                if (read.length === 0) {
                    listElement.innerHTML = '<li class="loading">Tabelis ei leitud ühtegi nime.</li>';
                    countInfo.textContent = "Nimesid ei leitud";
                } else {
                    listElement.innerHTML = read.map((nimi, indeks) => `
                        <li class="name-item">
                            <span class="name-index">${indeks + 1}</span>
                            <span>${nimi}</span>
                        </li>
                    `).join("");
                    countInfo.textContent = `Nimed otse Google Sheetsist (kokku ${read.length})`;
                }

                const nuud = new Date();
                const aegStr = nuud.toLocaleTimeString("et-EE");
                lastUpdated.textContent = `Viimati uuendatud: kell ${aegStr}`;
                jargmineUuendusAeg = Date.now() + INTERVAL_SEKUNDID * 1000;

            } catch (viga) {
                console.error("Viga andmete laadimisel:", viga);
                if (listElement.querySelector(".name-item") === null) {
                    listElement.innerHTML = `<li class="error-message">Andmete laadimine ebaõnnestus: ${viga.message}</li>`;
                }
                lastUpdated.textContent = `Viimane katse ebaõnnestus kell ${new Date().toLocaleTimeString("et-EE")}`;
            } finally {
                btnRefresh.disabled = false;
                btnRefresh.textContent = "Värskenda kohe";
            }
        }

        // Taimeri loendur järgmise uuenduseni
        function uuendaTaimerit() {
            const sekundeidJaanud = Math.max(0, Math.round((jargmineUuendusAeg - Date.now()) / 1000));
            document.getElementById("sync-status").textContent = `Värskendub automaatselt: ${sekundeidJaanud}s`;
        }

        // Käivitame kohe lehe laadimisel
        document.addEventListener("DOMContentLoaded", () => {
            laeNimed();
            setInterval(laeNimed, INTERVAL_SEKUNDID * 1000);
            setInterval(uuendaTaimerit, 1000);
        });
    </script>
</body>
</html>
