<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Kalkulaator - Spordipäev</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px;">

    <div style="max-width: 500px; margin: 30px auto; background-color: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        
        <a href="index.html" style="color: #2563eb; text-decoration: none; font-weight: bold;">&larr; Tagasi pealehele</a>
        
        <h1 style="color: #1e3a8a; margin-top: 15px;">⏱️ Kiiruse kalkulaator</h1>
        <p style="color: #64748b;">Arvuta välja oma keskmine kiirus joostes!</p>

        #arvutuskasti disain
        <div style="background-color: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 20px;">
            
            <label style="font-weight: bold; color: #334155; display: block; margin-bottom: 5px;">Läbitud vahemaa (km):</label>
            <input type="number" id="distants" placeholder="nt 5" style="width: 95%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 15px; font-size: 16px;">

            <label style="font-weight: bold; color: #334155; display: block; margin-bottom: 5px;">Aeg (minutites):</label>
            <input type="number" id="aeg" placeholder="nt 25" style="width: 95%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 20px; font-size: 16px;">

            <button onclick="arvutaKiirus()" style="width: 100%; background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;">Arvuta tulemus</button>

            #tulemuse kuvamine
            <div id="tulemus-kast" style="margin-top: 20px; padding: 15px; background-color: #e0f2fe; border-radius: 6px; text-align: center; display: none;">
                <h3 id="tulemus" style="margin: 0; color: #0369a1;">-</h3>
            </div>

        </div>

    </div>

    #kalkulaator
    <script>
        function arvutaKiirus() {
            let km = document.getElementById('distants').value;
            let min = document.getElementById('aeg').value;
            let tulemusKast = document.getElementById('tulemus-kast');
            let tulemusTekst = document.getElementById('tulemus');

            if (km > 0 && min > 0) {
                let kiirus = (km / min) * 60;
                tulemusTekst.innerText = "Sinu keskmine kiirus: " + kiirus.toFixed(2) + " km/h";
                tulemusKast.style.display = "block";
            } else {
                tulemusTekst.innerText = "Palun täida mõlemad väljad!";
                tulemusKast.style.display = "block";
            }
        }
    </script>

</body>
</html>
