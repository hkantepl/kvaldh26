<!doctype html>
<html>
  <head>
     <title>Joonistuspaberi hinna leidja</title>
     <script>
        function arvutus(){
           vastus.innerText="Maksab "+(kogus.valueAsNumber*60)+" senti";
        }
     </script>
  </head>
  <body>
    Lehe hind on 60 senti. Mitu lehte? <br />
    <input type="number" id="kogus" />
    <input type="button" value="arvuta" onclick="arvutus()" />
    <span id="vastus">vastuse koht</span>
    <img src="Screenshot 2026-09-18 at 15.20.22.png" />
  </body>
</html>
