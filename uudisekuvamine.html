<!DOCTYPE html>
<html>
  <head>
    <title>Teated</title>
    <script>
      function loe(){
        fetch("https://script.google.com/macros/s/AKfycbxvYl2cw9xQRb3CY7mFecaS49pneTkqJK5Mg51FvCQm0GkhDU5V08hnBPDtE-gqo-U/exec").then(d => d.json()).then(kuva);
      }
      function kuva(tekst){
        console.log(tekst);
        v1.innerText=tekst;
        p1.innerText=tekst[0];
        s1.innerText=tekst[1];
      }
    </script>
  </head>
 <body onload="loe(); setInterval('loe()', 10000)">
    Teade: <span id="v1">teate koht</span>
    <input type="button" value="Kuva teade" onclick="loe()"/>
    <h1 id="p1">Pealkirja koht</h1>
    <div id="s1">sisu koht</div>
  </body>
</html>
